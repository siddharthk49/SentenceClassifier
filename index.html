<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentence Sentiment Classifier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    h1 {
      color: #333;
    }

    textarea {
      width: 100%;
      max-width: 600px;
      height: 150px;
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 20px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    .result {
      margin-top: 30px;
      font-size: 18px;
      color: #444;
    }
  </style>
</head>
<body>
  <h1>Sentence Sentiment Classifier</h1>

  <textarea id="textInput" placeholder="Your sentence goes here"></textarea>
  <br>
  <button onclick="predict()">Predict</button>

  <div class="result" id="resultBox"></div>

  <script>
    async function predict() {
      const text = document.getElementById("textInput").value;
      const resultBox = document.getElementById("resultBox");

      if (!text.trim()) {
        resultBox.innerHTML = "Please enter some text!";
        return;
      }

      resultBox.innerHTML = "Predicting...";

      try {
        const response = await fetch("http://localhost:8000/predict", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ text: text }),
        });

        const data = await response.json();
        resultBox.innerHTML = `<strong>Label:</strong> ${data.label} <br><strong>Confidence:</strong> ${(data.score * 100).toFixed(2)}%`;
      } catch (error) {
        console.error(error);
        resultBox.innerHTML = "Error fetching prediction.";
      }
    }
  </script>
</body>
</html>
